[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-lens"
version = "0.1.0"
description = "Evidence-grounded enterprise project collaboration agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pycryptodome>=3.20.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "pyyaml>=6.0",
]
mcp = [
    "mcp>=1.1.0",
]
feishu-ws = [
    "lark-oapi>=1.4.0",
]

[project.scripts]
project-lens-mcp = "project_lens.integrations.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/project_lens", "src/insight_project"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
